---
name: build-and-artifacts

"on":
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          chmod +x ./encode_split_folder.sh ./reconstruct_folder.sh
          base="$(mktemp -d)"
          mkdir -p "$base/in/nested"
          printf "a\n" >"$base/in/a.txt"
          printf "b\n" >"$base/in/nested/b.txt"
          ./encode_split_folder.sh "$base/in" -o "$base/parts" >/dev/null
          ./reconstruct_folder.sh "$base/parts" -o "$base/out" >/dev/null
          diff -ru "$base/in" "$base/out"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $id = [Guid]::NewGuid().ToString('n')
          $base = Join-Path $env:TEMP ("b64slicer-" + $id)
          $in = Join-Path $base 'in'
          $nested = Join-Path $in 'nested'
          New-Item -ItemType Directory -Path $nested -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $in 'a.txt') -Value "a`n"
          Set-Content -LiteralPath (Join-Path $nested 'b.txt') -Value "b`n"
          $parts = Join-Path $base 'parts'
          $out = Join-Path $base 'out'
          .\encode_split_folder.ps1 $in $parts | Out-Null
          .\reconstruct_folder.ps1 $parts $out | Out-Null

          $inRoot = (Resolve-Path -LiteralPath $in).Path
          $outRoot = (Resolve-Path -LiteralPath $out).Path
          $inFiles = Get-ChildItem -LiteralPath $inRoot -Recurse -File |
            ForEach-Object { [System.IO.Path]::GetRelativePath($inRoot, $_.FullName) } |
            Sort-Object
          $outFiles = Get-ChildItem -LiteralPath $outRoot -Recurse -File |
            ForEach-Object { [System.IO.Path]::GetRelativePath($outRoot, $_.FullName) } |
            Sort-Object

          $diff = Compare-Object `
            -ReferenceObject $inFiles `
            -DifferenceObject $outFiles
          if ($diff) {
            $diff | Format-Table | Out-String | Write-Error
            throw "File lists differ."
          }
          foreach ($rel in $inFiles) {
            $inPath = Join-Path $inRoot $rel
            $outPath = Join-Path $outRoot $rel
            $inHashObj = Get-FileHash -Algorithm SHA256 -LiteralPath $inPath
            $outHashObj = Get-FileHash -Algorithm SHA256 -LiteralPath $outPath
            $inHash = $inHashObj.Hash
            $outHash = $outHashObj.Hash
            if ($inHash -ne $outHash) { throw "Hash mismatch: $rel" }
          }

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare artifact bundle
        run: |
          mkdir -p artifact
          cp -v \
            README.md \
            pyproject.toml \
            encode_split.py \
            reconstruct.py \
            reconstruct.sh \
            reconstruct.ps1 \
            encode_split_folder.sh \
            reconstruct_folder.sh \
            encode_split_folder.ps1 \
            reconstruct_folder.ps1 \
            artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: b64-encode-slicer
          path: artifact
